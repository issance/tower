---
version: 2
before:
  hooks:
    - go mod tidy
    - go mod vendor

release:
  prerelease: auto
  draft: true
  header: |
    ## Upgrade

    Please follow the steps outlined in the [upgrade guide](https://issance.com/docs/tower/setup/upgrade/) to update your existing Tower installation.

builds:
  - id: tower
    main: ./cmd/tower
    mod_timestamp: "{{ .CommitTimestamp }}"
    env:
      - CGO_ENABLED=0
    targets:
      - darwin_amd64
      - darwin_arm64
      - freebsd_amd64
      - linux_amd64
      - linux_arm64
    flags:
      - -mod=readonly

archives:
  - id: golang-cross
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    formats:
      - binary

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}"
  format: tar.gz
  files:
    - "vendor/"

nfpms:
  # Configure nFPM for .deb releases
  #
  # See https://goreleaser.com/customization/package/nfpm/
  #
  # Useful tools for debugging .debs:
  # List file contents: dpkg -c dist/tower...deb
  # Package metadata: dpkg --info dist/tower....deb
  #
  - ids:
      - tower
    package_name: tower
    priority: optional
    vendor: tower
    maintainer: Kristoffer Dalby <kristoffer@dalby.cc>
    homepage: https://github.com/juanfont/tower
    description: |-
      Open source implementation of the Tailscale control server.
      Tower aims to implement a self-hosted, open source alternative to the
      Tailscale control server. Tower's goal is to provide self-hosters and
      hobbyists with an open-source server they can use for their projects and
      labs. It implements a narrow scope, a single Tailscale network (tailnet),
      suitable for a personal use, or a small open-source organisation.
    bindir: /usr/bin
    section: net
    formats:
      - deb
    contents:
      - src: ./config-example.yaml
        dst: /etc/tower/config.yaml
        type: config|noreplace
        file_info:
          mode: 0644
      - src: ./packaging/systemd/tower.service
        dst: /usr/lib/systemd/system/tower.service
      - dst: /var/lib/tower
        type: dir
      - src: ./config-example.yaml
        dst: /usr/share/doc/tower/examples/config-example.yaml
      - src: LICENSE
        dst: /usr/share/doc/tower/copyright
    scripts:
      postinstall: ./packaging/deb/postinst
      postremove: ./packaging/deb/postrm
      preremove: ./packaging/deb/prerm
    deb:
      lintian_overrides:
        - no-changelog # Our CHANGELOG.md uses a different formatting
        - no-manual-page
        - statically-linked-binary

kos:
  - id: ghcr
    repositories:
      - ghcr.io/juanfont/tower
      - issance/tower

    # bare tells KO to only use the repository
    # for tagging and naming the container.
    bare: true
    base_image: gcr.io/distroless/base-debian13
    labels:
      org.opencontainers.image.source: https://github.com/juanfont/tower
    annotations:
      org.opencontainers.image.source: https://github.com/juanfont/tower
    build: tower
    main: ./cmd/tower
    env:
      - CGO_ENABLED=0
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ if not .Prerelease }}latest{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}.{{ .Patch }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}.{{ .Patch }}{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}stable{{ else }}unstable{{ end }}"
      - "{{ .Tag }}"
      - '{{ trimprefix .Tag "v" }}'
      - "sha-{{ .ShortCommit }}"
    creation_time: "{{.CommitTimestamp}}"
    ko_data_creation_time: "{{.CommitTimestamp}}"

  - id: ghcr-debug
    repositories:
      - ghcr.io/juanfont/tower
      - issance/tower

    bare: true
    base_image: gcr.io/distroless/base-debian13:debug
    labels:
      org.opencontainers.image.source: https://github.com/juanfont/tower
    annotations:
      org.opencontainers.image.source: https://github.com/juanfont/tower
    build: tower
    main: ./cmd/tower
    env:
      - CGO_ENABLED=0
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ if not .Prerelease }}latest-debug{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}.{{ .Patch }}-debug{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}-debug{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}-debug{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}.{{ .Patch }}-debug{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}-debug{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}-debug{{ end }}"
      - "{{ if not .Prerelease }}stable-debug{{ else }}unstable-debug{{ end }}"
      - "{{ .Tag }}-debug"
      - '{{ trimprefix .Tag "v" }}-debug'
      - "sha-{{ .ShortCommit }}-debug"

checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
